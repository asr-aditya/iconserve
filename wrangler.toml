name = "iconserve"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "icons-for-agents.site"
custom_domain = true

# Static landing page + assets served from ./public
[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker before serving the homepage asset so it can add agent-discovery Link
# headers and honor `Accept: text/markdown`. Other assets keep the fast direct-serve path.
run_worker_first = true

# R2 bucket holds icon SVGs + embeddings.bin + catalog.json
[[r2_buckets]]
binding = "ICONS"
bucket_name = "iconserve-icons"

# Workers AI: embeds the query string at search time (bge-small-en-v1.5, 384-dim)
[ai]
binding = "AI"

[observability]
enabled = true

# Analytics Engine — agent/human traffic + MCP funnel logging (query via scripts/analytics.mjs).
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "iconserve_events"

[vars]
DEFAULT_SET_ORDER = "lucide,heroicons,tabler,simple-icons"
# IndexNow key — served at /{key}.txt so Bing/Yandex can verify ownership of ping submissions.
INDEXNOW_KEY = "cd4babd43b576a1f8488464a1aad2375"
